<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sri Vijaya Ganapati Youth - Contribution</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      padding: 16px 8px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      border: 1px solid #eaeaea;
    }

    .header {
      background: linear-gradient(135deg, #a82e1c, #851e0e);
      color: #ffffff;
      padding: 24px 20px;
      text-align: center;
    }

    .header .subtitle {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      opacity: 0.9;
      font-weight: 700;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 8px 0;
      line-height: 1.2;
    }

    .header .location {
      font-size: 12px;
      opacity: 0.85;
      line-height: 1.4;
    }

    .body {
      padding: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #dcdfe4;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #a82e1c;
    }

    .amount-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }

    .amount-btn {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 0;
      font-size: 15px;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.2s;
    }

    .amount-btn.active {
      background: #a82e1c;
      border-color: #a82e1c;
      color: #ffffff;
    }

    #customAmountBox {
      display: none;
      margin-top: 8px;
    }

    .pay-btn {
      width: 100%;
      background: #16a34a;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
      margin-top: 16px;
      text-decoration: none;
    }

    .pay-btn:active {
      transform: scale(0.98);
    }

    .qr-section {
      margin-top: 24px;
      border-top: 1px dashed #e2e8f0;
      padding-top: 18px;
      text-align: center;
    }

    .qr-section p {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 12px;
    }

    .qr-box {
      width: 170px;
      height: 170px;
      margin: 0 auto;
      background: #fff;
      padding: 8px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <div class="subtitle">Vinayaka Chavithi 2026</div>
      <h1>Sri Vijaya Ganapati Youth</h1>
      <div class="location">
        Gangavaram Village, Dr. B.R. Ambedkar Konaseema District,<br>Andhra Pradesh
      </div>
    </div>

    <div class="body">
      <div class="form-group">
        <label for="donorName">Donor Name</label>
        <input type="text" id="donorName" placeholder="Enter your name" value="Rajesh" />
      </div>

      <div class="form-group">
        <label>Select Amount (₹)</label>
        <div class="amount-grid">
          <button type="button" class="amount-btn" onclick="selectAmount(101, this)">₹101</button>
          <button type="button" class="amount-btn" onclick="selectAmount(251, this)">₹251</button>
          <button type="button" class="amount-btn active" onclick="selectAmount(501, this)">₹501</button>
          <button type="button" class="amount-btn" onclick="selectAmount(1001, this)">₹1001</button>
          <button type="button" class="amount-btn" onclick="selectAmount(2101, this)">₹2101</button>
         const upiId = "yourname@okhdfcbank"; // Put your real PhonePe/GPay UPI ID here
        </div>

        <button type="button" class="amount-btn" style="width: 100%;" onclick="toggleCustom(this)">Other Amount</button>
        <div id="customAmountBox">
          <input type="number" id="customAmount" placeholder="Enter amount in ₹" oninput="updateCustomAmount(this.value)" />
        </div>
      </div>

      <a id="payLink" href="#" class="pay-btn">
        Pay via Any UPI App (₹<span id="btnAmount">501</span>)
      </a>

      <div class="qr-section">
        <p>Or scan using Google Pay, PhonePe, or Paytm</p>
        <div class="qr-box">
          <img id="qrImage" src="" alt="UPI QR Code" />
        </div>
      </div>
    </div>
  </div>

  <script>
    // Replace with your real UPI ID and Payee Name
    const upiId = "yourupiid@okhdfcbank";
    const payeeName = "Sri Vijaya Ganapati Youth";
    let currentAmount = 501;

    function refreshUPI() {
      const note = encodeURIComponent("Ganapati Chanda 2026");
      const name = encodeURIComponent(payeeName);
      
      // Dynamic UPI deep-link
      const upiUrl = upi://pay?pa=${upiId}&pn=${name}&am=${currentAmount}&cu=INR&tn=${note};
      
      document.getElementById("payLink").href = upiUrl;
      document.getElementById("btnAmount").textContent = currentAmount;

      // Auto-generates real QR code via public QR API
      const qrApiUrl = https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiUrl)};
      document.getElementById("qrImage").src = qrApiUrl;
    }

    function selectAmount(val, btn) {
      currentAmount = val;
      document.querySelectorAll(".amount-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("customAmountBox").style.display = "none";
      refreshUPI();
    }

    function toggleCustom(btn) {
      document.querySelectorAll(".amount-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const box = document.getElementById("customAmountBox");
      box.style.display = "block";
      const input = document.getElementById("customAmount");
      input.focus();
      if (input.value) {
        currentAmount = Number(input.value) || 0;
        refreshUPI();
      }
    }

    function updateCustomAmount(val) {
      currentAmount = Number(val) || 0;
      refreshUPI();
    }

    // Initialize on page load
    refreshUPI();
  </script>
</body>
</html>
